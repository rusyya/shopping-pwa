
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4935F5"/>
            <stop offset="100%" stop-color="#8438E8"/>
        </linearGradient>
    </defs>

    <!-- Белый фон -->
    <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

    <!-- Градиентная обводка -->
    <rect x="12" y="12" width="488" height="488"
          rx="88" fill="none"
          stroke="url(#gradient)" stroke-width="12"/>

    <!-- Тележка -->
    <g transform="translate(-20, 0)"
       fill="none"
       stroke="url(#gradient)"
       stroke-width="24"
       stroke-linecap="round"
       stroke-linejoin="round">

        <path d="M136 166 H168 L205 340
                 Q208 354 224 354
                 H382 L416 224 H190"/>

        <!-- Колёса -->
        <circle cx="242" cy="402" r="17"/>
        <circle cx="366" cy="402" r="17"/>
    </g>
</svg>
